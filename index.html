<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAME WORD - 同词相遇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
body{background:#f7f4ff;padding:20px;}
.wrap{max-width:420px;margin:0 auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 20px #00000008;}
.title-top{color:#7b42d9;text-align:center;font-size:16px;margin-bottom:8px;}
h1{text-align:center;font-size:28px;color:#222;margin-bottom:10px;}
.info{text-align:center;color:#666;margin-bottom:12px;font-size:15px;}
.countdown{text-align:center;font-size:22px;color:#d63031;font-weight:bold;margin:10px 0;}
.tip{text-align:center;color:#e64340;margin:10px 0}
.success-tip{text-align:center;color:#209c57;margin:10px 0}
.wait-tip{text-align:center;color:#8b5cf6;font-weight:bold;margin:8px 0;}
.peer-submit-tip{text-align:center;color:#d97706;font-weight:bold;margin:8px 0;}
.round-item{margin-bottom:16px;}
.round-label{font-size:14px;color:#777;margin-bottom:6px;}
input{width:100%;padding:14px 12px;border-radius:14px;border:1px solid #e9e4f4;font-size:16px;outline:none;background:#f9f6ff;}
input:focus{border-color:#b898e8;}
.btn-box{text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
button{padding:14px 22px;border:none;border-radius:16px;background:#7b42d9;color:#fff;font-size:16px;cursor:pointer;}
button:active{opacity:0.85;}
button:disabled{background:#c9b8e6;cursor:not-allowed;}
.result-box{display:none;margin-top:20px;}
.res-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.res-left,.res-right{flex:1;padding:14px 10px;border-radius:14px;text-align:center;font-size:18px;}
.res-left{background:#efe9ff;color:#5b27b4;}
.res-right{background:#e6f7f9;color:#228b94;}
.match{background:#d8f6ec;color:#198754;font-weight:bold;}
.cross{color:#999;font-weight:bold;}
.tip-bottom{text-align:center;margin-top:24px;color:#888;font-size:14px;}
.start-area{text-align:center;margin-top:30px;}
.room-input{width:70%;display:inline-block;margin-bottom:12px;}
.key-text{word-break:break-all;padding:10px;background:#f3f0ff;border-radius:12px;margin:10px 0;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
<div class="title-top">SAME WORD - 同词相遇</div>
<h1>你们的脑回路相遇了</h1>
<div class="info" id="roomInfo">等待配对</div>
<div class="countdown" id="countBox"></div>
<div class="wait-tip" id="waitTip"></div>
<div class="peer-submit-tip" id="peerSubmitTip"></div>
<div class="tip" id="tipBox"></div>
<div class="success-tip" id="successBox"></div>
<div id="startArea" class="start-area">
<button onclick="createPeer()">创建房间</button>
<div style="margin:16px 0">—— 或者粘贴密钥加入 ——</div>
<input class="room-input" id="inputKey" placeholder="粘贴对方密钥">
<button onclick="joinPeer()">加入房间</button>
<div id="keyShow" class="key-text" style="display:none"></div>
</div>
<div id="writeArea" style="display:none">
<div class="round-item">
<div class="round-label" id="curRoundLabel">第 1 轮，请输入词语</div>
<input id="curInput" placeholder="在这里输入本轮词语">
</div>
<div class="btn-box">
<button id="submitBtn" onclick="submitRound()">提交本轮</button>
</div>
</div>
<div class="result-box" id="resultArea">
<div class="result-title">你们的脑回路相遇了</div>
<div class="result-sub" id="resultRoomInfo"></div>
<div id="res-container"></div>
<div class="tip-bottom">表达可以不同，只要想到的是同一个东西。</div>
<div class="btn-box">
<button onclick="resetGame()">再来一局</button>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
let peer, conn;
const TOTAL_ROUND = 8;
const ROUND_TIME = 90;
let currentRound = 0;
let myWords = Array(TOTAL_ROUND).fill('');
let remoteWords = Array(TOTAL_ROUND).fill('');
let myRoundSubmit = Array(TOTAL_ROUND).fill(false);
let remoteRoundSubmit = Array(TOTAL_ROUND).fill(false);
let timer = null;
let remainSec = 0;
let isCreator = false;
let waitingAck = false; // 是否正在等待对方重置确认

const tipBox = document.getElementById('tipBox');
const successBox = document.getElementById('successBox');
const waitTip = document.getElementById('waitTip');
const peerSubmitTip = document.getElementById('peerSubmitTip');
const roomInfo = document.getElementById('roomInfo');
const startArea = document.getElementById('startArea');
const writeArea = document.getElementById('writeArea');
const resultArea = document.getElementById('resultArea');
const resContainer = document.getElementById('res-container');
const submitBtn = document.getElementById('submitBtn');
const keyShow = document.getElementById('keyShow');
const countBox = document.getElementById('countBox');
const curRoundLabel = document.getElementById('curRoundLabel');
const curInput = document.getElementById('curInput');

function showTip(text){
tipBox.innerText = text;
setTimeout(()=>tipBox.innerText='',2500);
}
function showSuccess(text){
successBox.innerText = text;
setTimeout(()=>successBox.innerText='',2500);
}
function setWaitTip(text){
waitTip.innerText = text;
}
function setPeerSubmitTip(text){
peerSubmitTip.innerText = text;
}
function clearAllRoundTips(){
setWaitTip('');
setPeerSubmitTip('');
}

// 彻底清空所有游戏数据
function fullClearData(){
clearInterval(timer);
countBox.innerText='';
clearAllRoundTips();
currentRound = 0;
myWords = Array(TOTAL_ROUND).fill('');
remoteWords = Array(TOTAL_ROUND).fill('');
myRoundSubmit = Array(TOTAL_ROUND).fill(false);
remoteRoundSubmit = Array(TOTAL_ROUND).fill(false);
curInput.value = '';
submitBtn.disabled = false;
}

// 创建房间
function createPeer(){
peer = new Peer();
peer.on('open', (id)=>{
roomInfo.innerText = `你的密钥：${id}`;
keyShow.style.display = 'block';
keyShow.innerText = id;
showSuccess('✅ 把上面密钥发给好友，让他粘贴加入！');
})
peer.on('connection', (c)=>{
conn = c;
isCreator = true;
bindConn();
showSuccess('✅ 好友连上啦！游戏即将开始');
startArea.style.display = 'none';
writeArea.style.display = 'block';
startNewRound();
})
peer.on('error', err=>{
showTip('连接失败：'+err.type);
})
}

// 加入房间
function joinPeer(){
const rid = document.getElementById('inputKey').value.trim();
if(!rid) return showTip('请粘贴密钥');
peer = new Peer();
peer.on('open', ()=>{
conn = peer.connect(rid);
isCreator = false;
bindConn();
})
}

function bindConn(){
conn.on('open', ()=>{
showSuccess('✅ 配对成功！等待游戏开始');
startArea.style.display = 'none';
writeArea.style.display = 'block';
})
conn.on('data', (data)=>{
switch(data.type){
case 'goNext':
startNewRound();
break;
case 'gameOver':
renderResult(myWords, remoteWords);
writeArea.style.display = 'none';
resultArea.style.display = 'block';
break;
case 'reset':
// 收到重置指令：清空自己数据，回复ack
fullClearData();
writeArea.style.display = 'block';
resultArea.style.display = 'none';
showSuccess('🔄 准备新一局...');
conn.send({type:'resetAck'});
break;
case 'resetAck':
// 收到对方确认，发起方发送goNext开启第一轮
if(waitingAck){
waitingAck = false;
conn.send({type:'goNext'});
startNewRound();
}
break;
case 'roundData':
remoteWords[data.roundIdx] = data.word;
remoteRoundSubmit[data.roundIdx] = true;
if(!myRoundSubmit[data.roundIdx]){
setPeerSubmitTip("🔔对方已经提交本轮，请尽快作答！");
}
if(isCreator){
checkRoundEndByCreator();
}
break;
}
})
conn.on('close', ()=>{
clearInterval(timer);
countBox.innerText='';
clearAllRoundTips();
showTip('对方断开连接了');
})
conn.on('error',err=>showTip('通讯异常'))
}

// 房主判断本轮两人都提交完成
function checkRoundEndByCreator(){
const idx = currentRound - 1;
if(myRoundSubmit[idx] && remoteRoundSubmit[idx]){
if(currentRound >= TOTAL_ROUND){
conn.send({type:'gameOver'});
renderResult(myWords, remoteWords);
writeArea.style.display = 'none';
resultArea.style.display = 'block';
}else{
conn.send({type:'goNext'});
startNewRound();
}
}
}

function startNewRound(){
clearInterval(timer);
clearAllRoundTips();
currentRound ++;
if(currentRound > TOTAL_ROUND){
return;
}
curRoundLabel.innerText = `第 ${currentRound} 轮，请输入词语`;
curInput.value = '';
submitBtn.disabled = false;
remainSec = ROUND_TIME;
countBox.innerText = `⏱ ${remainSec} 秒`;
timer = setInterval(()=>{
remainSec --;
countBox.innerText = `⏱ ${remainSec} 秒`;
if(remainSec <= 0){
if(!myRoundSubmit[currentRound-1]){
submitRound();
}
}
},1000);
}

function submitRound(){
clearInterval(timer);
countBox.innerText='';
const w = curInput.value.trim();
const idx = currentRound -1;
myWords[idx] = w;
myRoundSubmit[idx] = true;
submitBtn.disabled = true;
setWaitTip("✅已提交，正在等待对方完成本轮...");
setPeerSubmitTip('');
conn.send({type:'roundData', roundIdx:idx, word:w});
if(isCreator){
checkRoundEndByCreator();
}
}

function renderResult(p1,p2){
resContainer.innerHTML = '';
for(let i=0;i<TOTAL_ROUND;i++){
let v1 = p1[i] || '—';
let v2 = p2[i] || '—';
let isSame = v1 === v2 && v1 !== '—';
let cls1 = isSame ? 'res-left match' : 'res-left';
let cls2 = isSame ? 'res-right match' : 'res-right';
resContainer.innerHTML += `
<div class="round-item">
<div class="round-label">第 ${i+1} 轮</div>
<div class="res-row">
<div class="${cls1}">${v1}</div>
<span class="cross">×</span>
<div class="${cls2}">${v2}</div>
</div>
</div>
`
}
let matchCount = 0;
for(let i=0;i<TOTAL_ROUND;i++){
if(p1[i]&&p2[i]&&p1[i]===p2[i]) matchCount++;
}
let rate = Math.round(matchCount/TOTAL_ROUND*100);
document.getElementById('resultRoomInfo').innerText = `共 ${TOTAL_ROUND} 轮 · 匹配${matchCount}轮 · 默契度 ${rate}%`
}

// 再来一局：任何人点击都可以发起重置
function resetGame(){
if(waitingAck) return;
waitingAck = true;
fullClearData();
writeArea.style.display = 'block';
resultArea.style.display = 'none';
conn.send({type:'reset'});
}
</script>
</body>
</html>
